name: Build PatchDL

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout PS5 Payload SDK
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/sdk
          path: ps5-payload-sdk

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y bash socat cmake pkg-config clang-15 lld-15 wget build-essential

      - name: Build and install SDK
        working-directory: ps5-payload-sdk
        run: |
          make
          make DESTDIR=${{ runner.tool_cache }}/ps5-payload-sdk install
          echo "PS5_PAYLOAD_SDK=${{ runner.tool_cache }}/ps5-payload-sdk" >> $GITHUB_ENV

      - name: Build PatchDL
        run: |
          chmod +x scripts/build_ps5.sh
          ./scripts/build_ps5.sh

      - name: Upload compiled ELF
        uses: actions/upload-artifact@v4
        with:
          name: patchdl-elf
          path: "*.elf"
          if-no-files-found: error
